name: Build Windows EXE

on:
  push:
    paths:
      - 'windows-idle/**'
      - '.github/workflows/build-windows-idle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r windows-idle/requirements.txt
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name MonsterIdle windows-idle/main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MonsterIdle-Windows
          path: dist/MonsterIdle.exe
