<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ChatGPT Game 2 - Dash Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10182c;color:#fff;font-family:system-ui,sans-serif;display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:14px}.wrap{width:min(900px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}h1{font-size:clamp(22px,5vw,34px);margin:0;color:#7ef9ff}button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;background:#7ef9ff;color:#102039;cursor:pointer}canvas{display:block;width:100%;aspect-ratio:16/9;background:#182748;border:2px solid #30476d;border-radius:16px;touch-action:manipulation}.hint{text-align:center;color:#c3d1e8;font-size:14px;margin:10px 0}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{background:#202e4b;padding:8px 14px;border-radius:999px}
</style></head><body><main class="wrap"><header><h1>⚡ CHATGPT GAME 2: RUNNER</h1><div class="pill">최고 점수 <b id="best">0</b></div></header><canvas id="game" width="960" height="540" aria-label="러너 게임"></canvas><p class="hint" id="hint">화면을 터치하거나 스페이스바를 눌러 점프!</p><div class="row"><button id="jump">점프 / 시작</button><button id="restart">다시 시작 ↻</button><div class="pill">점수 <b id="score">0</b></div></div></main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),hint=document.getElementById('hint');
let best=Number(localStorage.getItem('dashRunnerBest')||0);bestEl.textContent=best;
let player,obstacles,coins,score,speed,frame,playing,dead,ground;
function reset(){player={x:150,y:0,w:42,h:54,vy:0,onGround:true};ground=420;player.y=ground-player.h;obstacles=[];coins=[];score=0;speed=6;frame=0;playing=false;dead=false;scoreEl.textContent='0';hint.textContent='터치 또는 스페이스바로 점프 · 코인을 모아 최고 기록을 세워 봐!';draw()}
function jump(){if(dead){reset();playing=true;return}if(!playing){playing=true;hint.textContent='장애물을 피해 달려!';}if(player.onGround){player.vy=-16;player.onGround=false}}
function spawn(){let h=30+Math.random()*35,w=25+Math.random()*25;obstacles.push({x:1000,y:ground-h,w,h});if(Math.random()<.65)coins.push({x:1020,y:ground-100-Math.random()*90,r:10,taken:false})}
function draw(){ctx.clearRect(0,0,960,540);let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#182748');g.addColorStop(1,'#263d60');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);
ctx.fillStyle='#d8f7ff';for(let i=0;i<45;i++){let x=(i*197-frame*0.25)%960;if(x<0)x+=960;ctx.globalAlpha=.25+(i%3)*.2;ctx.fillRect(x,35+(i*61)%250,3,3)}ctx.globalAlpha=1;
ctx.fillStyle='#10182c';ctx.fillRect(0,ground,960,120);ctx.fillStyle='#7ef9ff';ctx.fillRect(0,ground,960,5);ctx.strokeStyle='#385779';ctx.lineWidth=2;for(let x=-(frame*speed%70);x<960;x+=70){ctx.beginPath();ctx.moveTo(x,ground+35);ctx.lineTo(x+35,ground+35);ctx.stroke()}
coins.forEach(o=>{if(o.taken)return;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0ad';ctx.lineWidth=4;ctx.stroke()});
obstacles.forEach(o=>{ctx.fillStyle='#ff5277';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffb2c3';ctx.lineWidth=3;ctx.stroke()});
ctx.fillStyle='#7ef9ff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#102039';ctx.fillRect(player.x+25,player.y+12,7,7);ctx.fillStyle='#fff';ctx.fillRect(player.x+28,player.y+14,3,3);ctx.fillStyle='#53d8e6';ctx.fillRect(player.x+5,player.y+player.h-5,12,8);ctx.fillRect(player.x+27,player.y+player.h-5,12,8);
if(!playing&&!dead){ctx.fillStyle='rgba(6,12,25,.45)';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 48px system-ui';ctx.fillText('DASH RUNNER',480,230);ctx.font='24px system-ui';ctx.fillText('터치해서 달리기 시작!',480,280)}
if(dead){ctx.fillStyle='rgba(6,12,25,.62)';ctx.fillRect(0,0,960,540);ctx.textAlign='center';ctx.fillStyle='#ff7894';ctx.font='bold 54px system-ui';ctx.fillText('GAME OVER',480,230);ctx.fillStyle='#fff';ctx.font='26px system-ui';ctx.fillText('점수 '+Math.floor(score)+'  ·  다시 시작하려면 터치',480,285)}
}
function tick(){if(playing&&!dead){frame++;speed=Math.min(14,6+frame/1200);player.vy+=.72;player.y+=player.vy;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true}
if(frame%Math.max(42,Math.floor(95-speed*3))===0)spawn();obstacles.forEach(o=>o.x-=speed);coins.forEach(o=>{o.x-=speed;if(!o.taken&&Math.abs(o.x-(player.x+player.w/2))<o.r+player.w/2&&Math.abs(o.y-(player.y+player.h/2))<o.r+player.h/2){o.taken=true;score+=25}});
obstacles=obstacles.filter(o=>o.x+o.w>-10);coins=coins.filter(o=>o.x>-20&&!o.taken);for(const o of obstacles){if(player.x+player.w-7>o.x+5&&player.x+7<o.x+o.w-5&&player.y+player.h-5>o.y+8){dead=true;playing=false;hint.textContent='부딪혔어! 다시 도전해 봐.';break}}
score+=.12;scoreEl.textContent=Math.floor(score);if(Math.floor(score)>best){best=Math.floor(score);bestEl.textContent=best;localStorage.setItem('dashRunnerBest',best)}}draw();requestAnimationFrame(tick)}
c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('jump').addEventListener('click',jump);document.getElementById('restart').addEventListener('click',()=>{reset();playing=true});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
reset();tick();
})();
</script></body></html>
