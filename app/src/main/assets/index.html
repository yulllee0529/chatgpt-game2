<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>INFINITE MINE</title>
<style>
:root{--bg:#101923;--panel:#1c2b39;--gold:#ffd166;--text:#eef6ff;--muted:#9eb0c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
header{padding:14px 16px;background:#172431;border-bottom:2px solid #314657;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0;letter-spacing:1px} .tag{font-size:11px;color:#8ce0b0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}
.stat,.panel{background:var(--panel);border:1px solid #354b5d;border-radius:12px;padding:10px}
.label{font-size:11px;color:var(--muted)}.value{font-size:18px;font-weight:800;margin-top:3px}
main{padding:0 10px 18px;max-width:720px;margin:auto}
.scene{position:relative;border:2px solid #46596a;border-radius:12px;overflow:hidden;background:#172b39}
canvas{display:block;width:100%;height:290px;image-rendering:pixelated}
.depth{position:absolute;left:10px;top:10px;background:#0b111acc;padding:6px 9px;border-radius:7px;font-size:12px}
.hint{position:absolute;right:10px;top:10px;font-size:11px;background:#0b111acc;padding:6px;border-radius:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button{font:inherit;color:var(--text);font-weight:750;border:0;border-radius:10px;padding:12px 8px;background:#31546a;min-height:46px}
button:active{transform:scale(.98);filter:brightness(1.15)}button.primary{background:#d58b25;color:#211605}button:disabled{opacity:.4}
h2{font-size:15px;margin:0 0 8px}.shop{display:grid;grid-template-columns:1fr;gap:7px}.item{display:flex;align-items:center;gap:9px;background:#14222e;border:1px solid #33495a;border-radius:10px;padding:9px}.emoji{font-size:25px;width:32px;text-align:center}.desc{flex:1;min-width:0}.name{font-size:13px;font-weight:800}.detail{font-size:11px;color:var(--muted);margin-top:2px}.buy{min-width:90px;padding:9px 7px;font-size:12px}
.bottom{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;padding:12px 2px}.notice{color:#a9e7bf;font-size:12px;min-height:18px;margin:4px 2px}
@media(min-width:560px){.shop{grid-template-columns:1fr 1fr}canvas{height:340px}}
</style>
</head>
<body>
<header><div><h1>⛏️ INFINITE MINE</h1><div class="tag">2D 무한 광산 타이쿤 · v0.1</div></div><div style="font-size:24px">🪨</div></header>
<main>
<section class="stats">
 <div class="stat"><div class="label">보유 골드</div><div class="value" id="gold">0 G</div></div>
 <div class="stat"><div class="label">최대 깊이</div><div class="value" id="depthStat">0 m</div></div>
 <div class="stat"><div class="label">초당 수익</div><div class="value" id="income">0 G/s</div></div>
</section>
<section class="scene"><canvas id="mine" width="360" height="290"></canvas><div class="depth" id="depthLabel">깊이 0 m</div><div class="hint">화면을 눌러 채굴!</div></section>
<div class="actions"><button class="primary" id="dig">⛏️ 땅 파기</button><button id="sell">💰 광물 판매</button></div>
<div class="notice" id="notice">작은 구덩이에서 시작해 보자!</div>
<section class="panel"><h2>⚙️ 장비 업그레이드</h2><div class="shop" id="shop"></div></section>
<div class="bottom"><span>자동 저장 켜짐</span><button id="reset" style="padding:5px 9px;min-height:28px;background:#293845;font-size:10px">초기화</button></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), canvas=$('mine'),ctx=canvas.getContext('2d');
const ores=[
 {name:'돌',emoji:'🪨',value:1,color:'#79838c',min:0},
 {name:'구리',emoji:'🟤',value:5,color:'#b76e42',min:20},
 {name:'철',emoji:'⚙️',value:20,color:'#a8b4bd',min:80},
 {name:'은',emoji:'🥈',value:90,color:'#c9e1ed',min:250},
 {name:'금',emoji:'🥇',value:400,color:'#ffd166',min:600},
 {name:'다이아',emoji:'💎',value:2500,color:'#60e5ee',min:1500},
 {name:'미스릴',emoji:'🔮',value:20000,color:'#bd86ff',min:4000},
 {name:'외계 광석',emoji:'🌌',value:250000,color:'#ff6bd6',min:10000},
 {name:'차원 결정',emoji:'✨',value:5000000,color:'#fff39a',min:25000}
];
const gear=[
 {id:'pick',name:'곡괭이 강화',emoji:'⛏️',desc:'직접 채굴량 증가',base:15,scale:1.7},
 {id:'drill',name:'자동 드릴',emoji:'🔩',desc:'초당 자동 채굴 +1',base:80,scale:1.85},
 {id:'big',name:'산업용 굴착기',emoji:'🚜',desc:'초당 자동 채굴 +8',base:900,scale:1.95},
 {id:'robot',name:'채굴 로봇',emoji:'🤖',desc:'초당 자동 채굴 +60',base:12000,scale:2.05},
 {id:'plasma',name:'플라스마 드릴',emoji:'⚡',desc:'초당 자동 채굴 +500',base:250000,scale:2.15},
 {id:'value',name:'광물 가치 연구',emoji:'💎',desc:'판매 가격 +25%',base:250,scale:1.8}
];
let s={gold:0,depth:0,maxDepth:0,ore:0,pick:1,drill:0,big:0,robot:0,plasma:0,value:1,levels:{},last:Date.now()};
function load(){try{let x=JSON.parse(localStorage.getItem('infiniteMineSave'));if(x){s={...s,...x,levels:x.levels||{}};let elapsed=Math.min(8*3600,Math.max(0,(Date.now()-(s.last||Date.now()))/1000));let gain=autoRate()*elapsed*0.4;if(gain>0){s.gold+=gain;$('notice').textContent='오프라인 보상: +'+fmt(gain)+' G';}}}catch(e){}s.last=Date.now();}
function save(){s.last=Date.now();try{localStorage.setItem('infiniteMineSave',JSON.stringify(s))}catch(e){}}
function fmt(n){if(n<1000)return Math.floor(n).toLocaleString('ko-KR');const units=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n<10?2:1)+units[i]}
function autoRate(){return s.drill+8*s.big+60*s.robot+500*s.plasma}
function currentOre(){let o=ores[0];for(const x of ores)if(s.depth>=x.min)o=x;return o}
function dig(amount=1){const o=currentOre();s.ore+=amount;s.depth+=Math.max(1,Math.floor(amount*(0.3+s.pick*.08)));s.maxDepth=Math.max(s.maxDepth,s.depth);s.gold+=0;render();save();$('notice').textContent=o.emoji+' '+o.name+' 채굴! 광물을 판매해서 골드를 얻자.'}
function sell(){if(s.ore<=0){$('notice').textContent='판매할 광물이 없어! 먼저 땅을 파자.';return}let value=currentOre().value*s.ore*s.value;s.gold+=value;$('notice').textContent='광물 판매 완료! +'+fmt(value)+' G';s.ore=0;render();save()}
function price(g){return Math.floor(g.base*Math.pow(g.scale,s.levels[g.id]||0))}
function buy(g){let p=price(g);if(s.gold<p){$('notice').textContent='골드가 부족해! 광물을 더 캐서 판매하자.';return}s.gold-=p;s.levels[g.id]=(s.levels[g.id]||0)+1;if(g.id==='pick')s.pick+=1;if(g.id==='drill')s.drill+=1;if(g.id==='big')s.big+=1;if(g.id==='robot')s.robot+=1;if(g.id==='plasma')s.plasma+=1;if(g.id==='value')s.value*=1.25;$('notice').textContent=g.name+' 업그레이드 완료!';render();save()}
function draw(){let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#9bd7ee';ctx.fillRect(0,0,w,75);ctx.fillStyle='#5ca56d';ctx.fillRect(0,68,w,12);ctx.fillStyle='#493a32';ctx.fillRect(0,80,w,h-80);
for(let y=80;y<h;y+=24){for(let x=0;x<w;x+=24){let seed=Math.sin((x+13)*(y+17)+s.depth)*10000;ctx.fillStyle=seed%4>1?'#55443a':'#604b3d';ctx.fillRect(x,y,23,23);if(Math.abs(seed%17)<2.2){let o=ores.filter(z=>z.min<=s.depth).slice(-1)[0];ctx.fillStyle=o.color;ctx.fillRect(x+7,y+7,8,8);ctx.fillRect(x+13,y+11,5,5)}}}
ctx.fillStyle='#d7a15c';ctx.fillRect(145,48,16,30);ctx.fillStyle='#f0c18a';ctx.fillRect(146,38,14,14);ctx.fillStyle='#26394a';ctx.fillRect(143,36,18,6);ctx.fillStyle='#425b70';ctx.fillRect(139,57,7,16);ctx.fillRect(160,57,7,16);
ctx.strokeStyle='#dceaf4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(163,55);ctx.lineTo(177,42);ctx.lineTo(185,42);ctx.stroke();
ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('MINER',135,30);
ctx.fillStyle='#b2c2cf';ctx.font='11px system-ui';ctx.fillText('광물 보유: '+fmt(s.ore),10,h-12);
if(s.drill+s.big+s.robot+s.plasma>0){ctx.fillStyle='#f6bd60';ctx.fillRect(235,50,48,25);ctx.fillStyle='#172431';ctx.fillRect(242,57,9,9);ctx.fillRect(262,57,9,9);ctx.fillStyle='#cbd5e1';ctx.fillRect(245,76,6,8);ctx.fillRect(268,76,6,8);ctx.fillStyle='#fff';ctx.fillText('AUTO x'+fmt(autoRate()),220,43)}
}
function render(){ $('gold').textContent=fmt(s.gold)+' G';$('depthStat').textContent=fmt(s.maxDepth)+' m';$('depthLabel').textContent='깊이 '+fmt(s.depth)+' m';$('income').textContent=fmt(autoRate()*currentOre().value*s.value)+' G/s';$('sell').textContent='💰 광물 판매 ('+fmt(s.ore)+')';$('shop').innerHTML='';for(const g of gear){let level=s.levels[g.id]||0;let row=document.createElement('div');row.className='item';row.innerHTML='<div class="emoji">'+g.emoji+'</div><div class="desc"><div class="name">'+g.name+' Lv.'+level+'</div><div class="detail">'+g.desc+'</div></div><button class="buy">'+fmt(price(g))+' G</button>';row.querySelector('button').onclick=()=>buy(g);$('shop').appendChild(row)}draw()}
$('dig').onclick=()=>dig(s.pick);canvas.addEventListener('pointerdown',e=>{e.preventDefault();dig(s.pick)});
$('sell').onclick=sell;$('reset').onclick=()=>{if(confirm('저장 데이터를 모두 초기화할까?')){localStorage.removeItem('infiniteMineSave');location.reload()}};
load();render();setInterval(()=>{let rate=autoRate();if(rate>0){s.ore+=rate/2;s.depth+=Math.max(1,Math.floor(rate/5));s.maxDepth=Math.max(s.maxDepth,s.depth);if(s.ore>=1000){let val=currentOre().value*s.ore*s.value;s.gold+=val;s.ore=0;$('notice').textContent='자동 판매! +'+fmt(val)+' G'}render()}save()},1000);
})();
</script></body></html>
